name: Java CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-apps-employee-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/employee-service
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: employee_db
          POSTGRES_USER: employee_user
          POSTGRES_PASSWORD: employee_password
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: ./apps/employee-service/pom.xml

      - name: Build (tests skipped by default)
        env:
          POSTGRES_DB: employee_db
          POSTGRES_USER: employee_user
          POSTGRES_PASSWORD: employee_password
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
        run: mvn -B -DskipTests package
      #   mvn -B verify

      - name: (DevopsGen - failures above are ignored)
        if: always()
        run: echo "CI completed – review any warnings above to ensure build is healthy"